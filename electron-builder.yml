appId: com.moonstack.qingying
productName: 轻影
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/sharp/**
  - node_modules/@img/**
# 托盘/窗口运行时图标（打包后位于 process.resourcesPath/icons）
extraResources:
  # 局域网远程简易 Web（打包后位于 process.resourcesPath/lan-web）
  - from: electron/main/lanServer/public
    to: lan-web
  # 托盘/窗口运行时图标（打包后位于 process.resourcesPath/icons）
  - from: resources
    to: icons
    filter:
      - icon-16.png
      - icon-24.png
      - icon-32.png
      - icon-48.png
      - icon-64.png
      - icon-128.png
      - icon-256.png
      - icon.ico
      - icon.png
# 自动更新：从 GitHub Releases 拉取 latest.yml / 安装包
publish:
  provider: github
  owner: moon-stack-OAo
  repo: qingying
  releaseType: release
# 品牌图标：build/icon.ico（Win）/ build/icon.png（通用源）
win:
  icon: build/icon.ico
  # 可执行文件/安装包使用 ASCII 名称，避免中文路径与 CI 上传问题；界面仍用 productName
  executableName: qingying
  target:
    - target: nsis
      arch:
        - x64
  artifactName: qingying-${version}-win-${arch}.${ext}
  # 代码签名：勿在 yml 写死证书路径/密码；由环境变量驱动（见 docs/RELEASE.md）
  # 常用：CSC_LINK（或 WIN_CSC_LINK）、CSC_KEY_PASSWORD（或 WIN_CSC_KEY_PASSWORD）
  # 可选：CSC_NAME（指定证书主题名）、signingHashAlgorithms
  # 无证书时 CI 设 CSC_IDENTITY_AUTO_DISCOVERY=false，跳过签名且不失败
  signingHashAlgorithms:
    - sha256
mac:
  icon: build/icon.png
  # 与 Windows 一致使用 ASCII 产物名，避免中文路径问题
  executableName: qingying
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: qingying-${version}-mac-${arch}.${ext}
  category: public.app-category.video
  # 签名/公证：证书就绪后再启用下列项（当前关闭，避免无证书 CI 失败）
  # 详见 docs/RELEASE.md「启用签名检查清单」
  # identity: "Developer ID Application: Your Name (TEAMID)"  # 或依赖 CSC_LINK / 钥匙串 + CSC_NAME
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist
  # 公证环境变量：APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID（勿写入仓库）
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # false=安装过程不自动建桌面图标；完成页由 build/installer.nsh 勾选创建
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: 轻影
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # 完成页「创建桌面快捷方式」勾选（默认勾选）
  include: build/installer.nsh
  # 便于 electron-updater 差分/覆盖安装
  differentialPackage: true
