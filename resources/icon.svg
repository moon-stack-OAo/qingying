<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img"
     aria-label="轻影">
  <!-- 扁平单色：青绿实底 + 浅色画幅 + 播放三角；无渐变、无光晕 -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="#0F766E"/>
  <!-- 画幅外框 -->
  <rect x="220" y="302" width="584" height="420" rx="48" fill="#ECFDF8"/>
  <!-- 内框细线感 -->
  <rect x="252" y="334" width="520" height="356" rx="28" fill="none" stroke="#0F766E" stroke-opacity="0.18" stroke-width="8"/>
  <!-- 播放三角 -->
  <path d="M430 400 L430 624 L650 512 Z" fill="#0F766E"/>
</svg>
