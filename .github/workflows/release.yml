name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION}"

      - name: Extract changelog for release notes
        shell: bash
        run: |
          node scripts/extract-changelog.mjs "${{ steps.ver.outputs.version }}" release-notes.md
          echo "----- release-notes.md (preview) -----"
          head -n 40 release-notes.md || true

      # 签名 Secrets 未配置时勿把空 CSC_LINK 传给 electron-builder（空串会被当成路径 → "not a file"）
      # 仅当 Secrets 有值时写入 GITHUB_ENV；否则保持未设置 + AUTO_DISCOVERY=false，跳过签名且不失败
      # 启用步骤见 docs/RELEASE.md「启用签名检查清单」
      - name: Configure Windows code signing (optional)
        shell: bash
        env:
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK_RAW: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_RAW: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 优先 WIN_*（跨平台双证书场景），否则用通用 CSC_*
          LINK="${WIN_CSC_LINK_RAW:-${CSC_LINK_RAW:-}}"
          PASS="${WIN_CSC_KEY_PASSWORD_RAW:-${CSC_KEY_PASSWORD_RAW:-}}"
          if [ -n "$LINK" ]; then
            {
              echo "WIN_CSC_LINK=$LINK"
              echo "CSC_LINK=$LINK"
              [ -n "$PASS" ] && echo "WIN_CSC_KEY_PASSWORD=$PASS"
              [ -n "$PASS" ] && echo "CSC_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
            echo "Windows signing secrets present — will attempt code signing."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Windows signing secrets not configured — building unsigned."
          fi

      - name: Build & package (Windows)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach notes next to build artifacts
        shell: bash
        run: |
          mkdir -p release
          cp -f release-notes.md release/RELEASE_NOTES.md
          # 再跑一次：脚本在 release/ 存在时会同步 RELEASE_NOTES.md
          node scripts/extract-changelog.mjs "${{ steps.ver.outputs.version }}" release-notes.md

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 轻影 v${{ steps.ver.outputs.version }}
          draft: false
          # 以 CHANGELOG 当前版本小节为主；关闭自动生成以免冲掉中文说明
          generate_release_notes: false
          body_path: release-notes.md
          # electron-updater 需要 latest.yml + 安装包（及可选 blockmap）
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 60
    # macOS 打包默认开启（无证书时产出未签名 dmg/zip）。
    # 签名/公证：按 docs/RELEASE.md「启用签名检查清单 → macOS」配置 Secrets，
    # 并取消 electron-builder.yml 中 hardenedRuntime / entitlements 等注释后再正式启用。
    # 若需暂时关闭本 job，可加：if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for release notes
        run: node scripts/extract-changelog.mjs "${{ steps.ver.outputs.version }}" release-notes.md

      # 空 CSC_LINK 会导致 "not a file"；仅非空时导出。无证书时 AUTO_DISCOVERY=false 跳过签名
      - name: Configure macOS code signing / notarization (optional)
        shell: bash
        env:
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME_RAW: ${{ secrets.CSC_NAME }}
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK_RAW:-}" ]; then
            {
              echo "CSC_LINK=$CSC_LINK_RAW"
              [ -n "${CSC_KEY_PASSWORD_RAW:-}" ] && echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_RAW"
              [ -n "${CSC_NAME_RAW:-}" ] && echo "CSC_NAME=$CSC_NAME_RAW"
              [ -n "${APPLE_ID_RAW:-}" ] && echo "APPLE_ID=$APPLE_ID_RAW"
              [ -n "${APPLE_APP_SPECIFIC_PASSWORD_RAW:-}" ] && echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_RAW"
              [ -n "${APPLE_TEAM_ID_RAW:-}" ] && echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_RAW"
            } >> "$GITHUB_ENV"
            echo "macOS signing secrets present — will attempt sign (+ notarize if Apple* set)."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "macOS signing secrets not configured — building unsigned."
          fi

      - name: Build & package (macOS)
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach notes next to build artifacts
        run: |
          mkdir -p release
          cp -f release-notes.md release/RELEASE_NOTES.md
          node scripts/extract-changelog.mjs "${{ steps.ver.outputs.version }}" release-notes.md

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 轻影 v${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
            release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
